<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trolleado</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: #111;
            font-family: system-ui, sans-serif;
        }

        main {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: grid;
            place-items: center;
            isolation: isolate;
        }

        main::after {
            position: absolute;
            z-index: -1;
            inset: 0;
            background: rgb(0 0 0 / 35%);
            content: "";
        }

        img {
            position: absolute;
            z-index: -2;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            width: 100%;
            margin: 0;
            padding: 0.1em 0;
            font-size: clamp(2rem, 8vw, 8rem);
            font-weight: 900;
            line-height: 1;
            text-align: center;
            background: linear-gradient(90deg, #ff3b30, #ffb830, #fff52e, #36df65, #36cfff, #6855ff, #ed45d9, #ff3b30);
            background-size: 300% auto;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 5s linear infinite;
            filter: drop-shadow(0 4px 12px rgb(0 0 0 / 60%));
        }

        @keyframes rainbow {
            to {
                background-position: 300% center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            h1 {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <img src="img/WhatsApp%20Image%202026-10-27%20at%2010.43.50.jpeg" alt="">
        <h1>TROLLEADO PUTO!!!</h1>
    </main>
</body>
</html>
